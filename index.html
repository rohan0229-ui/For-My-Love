<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>For My Love 🤍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Parisienne&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <main class="opening">
    <div class="glow"></div>

    <section class="card">
      <p class="eyebrow">A little something made just for you</p>

      <h1>FOR MY<br><span>LOVE</span> 🤍</h1>

      <p class="subtitle">
        Some things are easier to feel<br>
        than to say.
      </p>

      <button id="openBtn">Open this for me ♡</button>

      <p class="signature">— Rohan</p>
    </section>
  </main>

  <div class="message" id="message">
    <div class="message-card">
      <span>🤍</span>
      <h2>For you.</h2>
      <p>This little world is only the beginning...</p>
      <button id="backBtn">Go back</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
